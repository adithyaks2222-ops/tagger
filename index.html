<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bifrost</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="sidebar">
    <h2>Bifrost Controls</h2>

    <div class="form-group">
      <label>Upload Image</label>
      <input type="file" id="input-image" accept="image/*" />
    </div>
    <div class="form-group">
      <label>Country Flag</label>
      <select id="select-flag">
        <option value="in" selected>🇮🇳 India</option>
        <option value="us">🇺🇸 United States</option>
        <option value="gb">🇬🇧 United Kingdom</option>
        <option value="ae">🇦🇪 United Arab Emirates</option>
        <option value="sa">🇸🇦 Saudi Arabia</option>
        <option value="ca">🇨🇦 Canada</option>
        <option value="au">🇦🇺 Australia</option>
        <option value="de">🇩🇪 Germany</option>
        <option value="fr">🇫🇷 France</option>
        <option value="jp">🇯🇵 Japan</option>
        <option value="sg">🇸🇬 Singapore</option>
        <option value="custom">📁 Upload Custom Flag...</option>
        <option value="none">🚫 No Flag</option>
      </select>
      <input type="file" id="input-flag" accept="image/*" style="margin-top: 4px;" title="Upload custom flag" />
    </div>
    <div class="form-group">
      <label>Location Title</label>
      <input type="text" id="input-title" value="City , District , Country" />
    </div>
    <div class="form-group">
      <label>Full Address</label>
      <input type="text" id="input-address" value="Address , pincode , country" />
    </div>
    <div class="form-group">
      <label>Latitude</label>
      <input type="text" id="input-lat" value="Coordinates" />
    </div>
    <div class="form-group">
      <label>Longitude</label>
      <input type="text" id="input-lng" value="Coordinates" />
    </div>
    <div class="form-group">
      <label>Date & Time</label>
      <input type="text" id="input-time" value="Day , Date , time GMT +05:30" />
    </div>

    <button class="btn-download" onclick="downloadImage()">Download Image</button>
  </div>

  <div class="preview-area">
    <div class="canvas-container" id="capture-area">
      <img id="display-image" class="uploaded-image" crossorigin="anonymous" src="https://images.unsplash.com/photo-1596401057633-54a8fe8ef647?auto=format&fit=crop&w=800&q=80" alt="Placeholder" />

      <div class="gps-tag-wrapper">

        <div class="tab-row">
          <div class="camera-tab">
            <img class="custom-camera-icon" src="src/Screenshot%202026-09-05%20161820.png" alt="Camera Icon" />
            GPS Map Camera
          </div>
        </div>

        <div class="cards-container">
          
          <div class="map-preview">
            <img id="map-img" crossorigin="anonymous" src="https://static-maps.yandex.ru/1.x/?ll=76.307723,10.027319&z=15&l=sat&size=200,200" alt="Map" />
            <svg class="map-pin-svg" viewBox="0 0 24 24">
              <path fill="#ea4335" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            <div class="google-logo">Google</div>
          </div>

          <div class="info-bubble">
            <div class="title-row">
              <span class="title" id="display-title">City , District , Country</span>
              <img class="flag" id="display-flag" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB0AAAASCAYAAACnxdXaAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAACxIAAAsSAdLdfvwAAALqSURBVEhLtZS/b1tVFMc/5973K36xHTduXCdNSktTWKDAQGGAEdGJAQnBysAP8W8gsbBVAnYGJAQTEhnYgAHRAYREq0iRSpM2KW3s2M6z/Z7tdw9DQlRbEFrhfqYrnaPzPfqec48wBVS/tHc+/2I+SO+eFE9PGLKIgYqGYT7SQiePCpu1t765K4ICiIK0P336I8T8RlTc4NRTTamc3ivd/GX/d2A+bflpp1UsS3/BWLdoHCvCcAl1KwaWVXlM0BVD7k828zeKoGJbuY2vzb7z1WVRRbqfnEut5sH9SQ5RAIuTsQr/A2cCZt5bqxlQUBkrLCgWJ9MUBA68JcZMBh493emKqlicF6NhBY1O4IIyzvjAuGGiqpKsfZDZxjVfk20kH3C4ZEcogtoAiSpQWCCPT3Gr6VE6vUqpfh7iGlqoYsI5MD6KAQTBgY7QtA2dG9DcIH7uzdqBaLeXIgSiIzRrwWAf8hGIoDZEwhLix6gYWu0eG+u3qC/O001SAC48uTzW5HHEMzO1Q3tVAVQ8iKpQOguVVZg7jxSXISgfxDDc2NimXC5w9efr9Pt9ur1souzxdOFwpiL5ZPDfsNbS2G3RbCbkoxzzkPsdH4lOTvoYsmzAhSfO8Orl5ymWZimXZydT/hNRVfn1j/Xk7MmlgpXjl1lR+sOM7368ys1727iCIwsG7LR3udNp0ui2aff3SYcDnDoC61OMCtTLVc5Vl7i4tMrbL71WE4Dg3Ut7hTCaO1NdpF6apxTN4nsezjmy0YBWP6GRtPmz02Cv1zk8oEedHLzHF/4fCY3H7SvfLxyJYmRuMmnaBMayfeWHheP9fAQkJNO9SA+CCioA0fsv7jn0ge0VoBgWhr61t8XYTVHZCq23YzxzLzJBJwrCLPCsJmnP9NJhcchocTgaroryzPWP1y4JwIdff1b/dv2nZxvd9uOqsqJGKy7PPVXNPc8f+OK1w8DbjYNop16ub73+wstbb1x8ZVMe4n/fz1+BOytzs2BsKAAAAABJRU5ErkJggg==" alt="Country Flag" />
            </div>
            <div class="meta-line" id="display-address">Address , pincode , country</div>
            <div class="meta-line" id="display-coords">Lat Coordinates° Long Coordinates°</div>
            <div class="meta-line time" id="display-time">Day , Date , time GMT +05:30</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
